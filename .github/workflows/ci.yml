name: CI

on:
  pull_request:
  push:
    branches: [staging, production]

# the token only reads; nothing in CI writes to the repo
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts PostgreSQL on the runner's Docker
      - run: ./mvnw -B verify
