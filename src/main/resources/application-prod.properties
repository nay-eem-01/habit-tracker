# Production (SPRING_PROFILES_ACTIVE=prod). Only what differs from application.properties.

# No defaults for what must be set per deployment: startup fails if these are missing.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-url=${APP_FRONTEND_URL}

# Behind a TLS reverse proxy: trust its X-Forwarded-* headers (client IP for rate limits, https).
server.forward-headers-strategy=native

spring.jpa.show-sql=false
logging.level.com.nayeem.habittracker=INFO
logging.level.org.apache.http=INFO
logging.level.org.springframework.security=INFO

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# A production database starts empty and is built by V1+. Baselining (for old dev databases made by
# ddl-auto) would skip V1 on any schema that isn't empty and fail at V2; refuse to start instead.
spring.flyway.baseline-on-migrate=false
