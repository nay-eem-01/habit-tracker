spring.application.name=habit-tracker

# Server Configuration
server.port=8080

# Application config
app.name = @project.name@
app.backendUrl = http://localhost:${server.port}
app.backendUrlShort = localhost:${server.port}

# psql Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/habit-tracker
spring.datasource.username=${db_user_name}
spring.datasource.password=${db_password}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.root=INFO
logging.level.org.example.bankingManagementApplication=DEBUG
logging.file.path=@project.artifactId@
logging.level.org.apache.http=DEBUG
logging.level.org.hibernate = ERROR
logging.level.org.springframework.ws = INFO
logging.level.org.springframework.web = INFO
logging.level.org.springframework.security=DEBUG

# Swagger config
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.tags-sorter = alpha
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.docExpansion = none