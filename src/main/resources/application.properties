spring.application.name=habit-tracker

# Server Configuration
server.port=8080

# Application config
app.name = @project.name@
app.backendUrl = http://localhost:${server.port}
app.backendUrlShort = localhost:${server.port}

# Security — the JWT secret has no default: startup fails without JWT_SECRET (>= 32 bytes).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=15m
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# psql Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/habit-tracker
spring.datasource.username=${db_user_name}
spring.datasource.password=${db_password}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Close the session at the end of the transaction, not the end of the request.
# Lazy access from a controller or serializer then fails loudly with
# LazyInitializationException instead of silently issuing queries per accessed
# association. Fix those by fetching what you need, not by re-enabling this.
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.nayeem.habittracker=DEBUG
logging.level.org.apache.http=DEBUG
logging.level.org.hibernate = ERROR
logging.level.org.springframework.ws = INFO
logging.level.org.springframework.web = INFO
logging.level.org.springframework.security=DEBUG

# Log file location is owned by logback-spring.xml (LOG_DIRECTORY), not by
# logging.file.path. Setting logging.file.path here would export LOG_PATH and
# override it — and its old value was relative, which wrote logs into the repo.
# To relocate them, pass -DLOG_PATH=/absolute/dir.

# Swagger config
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.tags-sorter = alpha
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.docExpansion = none