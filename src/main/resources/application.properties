spring.application.name=habit-tracker

# Local settings come from a git-ignored .env in the working directory (the project root); real
# environment variables override it. Absent in tests and in deployed environments, which is fine.
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=8080

# Application config
app.name = @project.name@
app.backendUrl = http://localhost:${server.port}
app.backendUrlShort = localhost:${server.port}

# Security — the JWT secret has no default: startup fails without JWT_SECRET (>= 32 bytes).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=15m
app.security.refresh-token.ttl=7d
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Notifications — reminders are always in-app; email is on top. Off by default: reminders are only
# logged. To send real email set APP_NOTIFICATIONS_EMAIL_ENABLED=true plus SPRING_MAIL_HOST,
# SPRING_MAIL_PORT (587), SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (e.g. a Gmail app password)
# and APP_NOTIFICATIONS_EMAIL_FROM. Enabled without a mail host, the app refuses to start.
app.notifications.email.enabled=${APP_NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.email.from=${APP_NOTIFICATIONS_EMAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File uploads (PLAN.md §13) — bytes on local disk, outside the repository; set APP_FILES_DIR to
# move them. Limits per file and per user; the multipart limits match, with room for form fields.
app.files.dir=${APP_FILES_DIR:${user.home}/.habit-tracker/files}
app.files.max-file-size=10MB
app.files.user-quota=100MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# psql Database Configuration — names as in .env (DB_URL, DB_USERNAME, DB_PASSWORD); the older
# lower-case db_user_name / db_password still work, for run configurations that use them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habit-tracker}
spring.datasource.username=${DB_USERNAME:${db_user_name}}
spring.datasource.password=${DB_PASSWORD:${db_password}}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Close the session at the end of the transaction, not the end of the request.
# Lazy access from a controller or serializer then fails loudly with
# LazyInitializationException instead of silently issuing queries per accessed
# association. Fix those by fetching what you need, not by re-enabling this.
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.nayeem.habittracker=DEBUG
logging.level.org.apache.http=DEBUG
logging.level.org.hibernate = ERROR
logging.level.org.springframework.ws = INFO
logging.level.org.springframework.web = INFO
logging.level.org.springframework.security=DEBUG

# Log file location is owned by logback-spring.xml (LOG_DIRECTORY), not by
# logging.file.path. Setting logging.file.path here would export LOG_PATH and
# override it — and its old value was relative, which wrote logs into the repo.
# To relocate them, pass -DLOG_PATH=/absolute/dir.

# Swagger config
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.tags-sorter = alpha
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.docExpansion = none