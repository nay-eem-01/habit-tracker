spring.application.name=habit-tracker

# Local settings come from a git-ignored .env in the working directory (the project root); real
# environment variables override it. Absent in tests and in deployed environments, which is fine.
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=8080

# Application config
app.name = @project.name@
app.backendUrl = http://localhost:${server.port}
# The name users see, until the product is renamed; and the web app's address (links in emails).
app.display-name=${APP_DISPLAY_NAME:Habit Tracker}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Security — the JWT secret has no default: startup fails without JWT_SECRET (>= 32 bytes).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=15m
app.security.refresh-token.ttl=7d
app.security.password-reset.ttl=30m
app.security.password-reset.max-per-hour=5
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Email — account mail only (password reset, email verification); reminders are never emailed.
# Off by default: the mail is only logged (user id, never the address). To send for real set
# APP_NOTIFICATIONS_EMAIL_ENABLED=true, SPRING_MAIL_HOST, SPRING_MAIL_PORT (587), SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD and APP_NOTIFICATIONS_EMAIL_FROM — e.g. Brevo's free SMTP relay (see DEV_LOG).
# Enabled without a mail host, the app refuses to start.
app.notifications.email.enabled=${APP_NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.email.from=${APP_NOTIFICATIONS_EMAIL_FROM:}
# SMTP login: on for real providers; MAIL_SMTP_AUTH=false for a local catcher like Mailpit, which
# takes mail without one (with auth on and no username, every send failed: MailAuthenticationException).
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true

# Web push (reminders). Off by default. Generate a VAPID key pair once (e.g. `npx web-push
# generate-vapid-keys`), keep the private key secret, and set APP_PUSH_ENABLED=true, VAPID_PUBLIC_KEY,
# VAPID_PRIVATE_KEY and VAPID_SUBJECT (mailto:you@example.com). Enabled without keys, the app won't start.
app.push.enabled=${APP_PUSH_ENABLED:false}
app.push.public-key=${VAPID_PUBLIC_KEY:}
app.push.private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:}

# File uploads (PLAN.md §13) — bytes on local disk, outside the repository; set APP_FILES_DIR to
# move them. Limits per file and per user; the multipart limits match, with room for form fields.
# Off until storage survives a redeploy (PLAN.md §3.5): new uploads get 403 FILE_UPLOADS_DISABLED.
app.files.enabled=${APP_FILES_ENABLED:false}
app.files.dir=${APP_FILES_DIR:${user.home}/.habit-tracker/files}
app.files.max-file-size=10MB
app.files.user-quota=100MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Tomcat reads (and drops) up to this much of a refused upload so the client still gets the 413;
# past it, it closes the connection rather than read an endless body. The default 2MB cut a 12MB
# upload off mid-response (checked against a real server 2026-10-06).
server.tomcat.max-swallow-size=20MB

# psql Database Configuration — names as in .env (DB_URL, DB_USERNAME, DB_PASSWORD); the older
# lower-case db_user_name / db_password still work, for run configurations that use them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habit-tracker}
spring.datasource.username=${DB_USERNAME:${db_user_name}}
spring.datasource.password=${DB_PASSWORD:${db_password}}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public

# Schema: Flyway owns it (src/main/resources/db/migration); Hibernate only checks the entities match
# and refuses to start if they don't. Change the schema with a new V{n}__description.sql — never by
# editing an applied one. A database created before Flyway (by ddl-auto=update) is baselined at
# version 1 on first start, then V2+ run on it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Close the session at the end of the transaction, not the end of the request.
# Lazy access from a controller or serializer then fails loudly with
# LazyInitializationException instead of silently issuing queries per accessed
# association. Fix those by fetching what you need, not by re-enabling this.
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.nayeem.habittracker=DEBUG
logging.level.org.apache.http=DEBUG
logging.level.org.hibernate = ERROR
logging.level.org.springframework.ws = INFO
logging.level.org.springframework.web = INFO
logging.level.org.springframework.security=DEBUG

# Log file location is owned by logback-spring.xml (LOG_DIRECTORY), not by
# logging.file.path. Setting logging.file.path here would export LOG_PATH and
# override it — and its old value was relative, which wrote logs into the repo.
# To relocate them, pass -DLOG_PATH=/absolute/dir.

# Swagger config
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.tags-sorter = alpha
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.docExpansion = none